<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meridian & Element Quiz</title>
<style>
:root{
  --bg:#1f1e1c; --bg2:#262523; --card:#2b2a27; --card2:#322f2b;
  --border:#413e39; --border-soft:#35322e;
  --ink:#ece9e1; --muted:#a49d8f; --faint:#7a7468;
  --accent:#cc785c; --accent-soft:#3a2c25;
  --good:#8fb384; --good-bg:#25332a;
  --bad:#d17b81; --bad-bg:#3a2529;
  --miss:#d9b25f; --miss-bg:#3a3222;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--border-soft);padding:10px 14px;display:flex;align-items:center;gap:10px}
#groupSelWrap{position:relative;flex:1;min-width:0}
#groupSelBtn{width:100%;font-family:inherit;font-size:0.82rem;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}
#groupSelBtn .chev{color:var(--faint);font-size:0.7rem}
#groupSelList{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.5);max-height:60vh;overflow-y:auto;z-index:30}
#groupSelList.open{display:block}
#groupSelList .opt{padding:11px 12px;font-size:0.82rem;cursor:pointer;border-bottom:1px solid var(--border-soft)}
#groupSelList .opt:last-child{border-bottom:none}
#groupSelList .opt:hover{background:var(--card2)}
#selectBackdrop{display:none;position:fixed;inset:0;z-index:15}
#selectBackdrop.open{display:block}
.score{font-size:0.8rem;font-weight:700;color:var(--accent);white-space:nowrap}
#modes{display:flex;gap:6px;padding:10px 14px 0}
#modes button{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-family:inherit;font-size:0.76rem;color:var(--muted);cursor:pointer}
#modes button.on{background:var(--accent);color:#211712;border-color:var(--accent);font-weight:700}
#progwrap{padding:10px 14px 0}
.pbar{height:5px;background:var(--border-soft);border-radius:3px;overflow:hidden}
.pbar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .25s ease}
.progtext{font-size:0.7rem;color:var(--faint);margin-top:5px;text-align:center}
#main{flex:1;overflow-y:auto;padding:14px 14px 100px}
.card{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px}
.dhead{text-align:center;margin:2px 0 14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.dhead .icon{width:34px;height:34px;opacity:.9}
.dhead .t{font-weight:700;font-size:1.05rem}
.dhead .s{font-size:0.76rem;color:var(--muted)}
.imgwrap{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:14px;background:#f4f2e7;max-height:40vh;display:flex;align-items:center;justify-content:center}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.qcat{font-size:0.66rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--accent);font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.qcat svg{width:16px;height:16px;flex-shrink:0}
.qt{font-size:1.02rem;line-height:1.45;margin-bottom:14px;font-weight:500}
.opts{display:grid;gap:9px}
button.o{font-family:inherit;font-size:0.92rem;padding:13px 14px;min-height:46px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);color:var(--ink);cursor:pointer;text-align:left;line-height:1.35}
button.o:hover:not(:disabled){border-color:var(--accent)}
button.o:disabled{cursor:default}
button.o.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
button.o.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.whynote{margin-top:12px;padding:11px 13px;background:var(--miss-bg);border:1px solid #5c4f2c;border-left:3px solid var(--miss);border-radius:0 8px 8px 0;font-size:0.83rem;color:#e8d9ad;display:none;line-height:1.5}
.whynote.show{display:block}
.checkopt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);cursor:pointer}
.checkopt input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px;flex-shrink:0}
.checkopt.correct{background:var(--good-bg);border-color:var(--good)}
.checkopt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.checkopt.missed{background:var(--miss-bg);border-color:var(--miss)}
.checkopt span{font-size:0.92rem;line-height:1.35}
.submitBtn{margin-top:12px;width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#211712;font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer}
.submitBtn:disabled{opacity:.4;cursor:default}
#bottombar{position:sticky;bottom:0;z-index:20;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 14px 18px}
#bottombar .inner{max-width:560px;margin:0 auto}
#nextBtn{display:none;width:100%;padding:15px;background:var(--ink);color:#211712;border:none;border-radius:11px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer}
#doneCard{display:none;text-align:center;padding-top:16px}
#doneCard .big{font-size:2.3rem;font-weight:700;color:var(--accent)}
#doneCard .lbl{font-size:0.85rem;color:var(--muted);margin-bottom:18px}
.donebtns{display:grid;gap:9px;max-width:340px;margin:0 auto}
.donebtns button{padding:12px;border-radius:10px;font-family:inherit;font-size:0.88rem;cursor:pointer}
.donebtns .primary{background:var(--accent);color:#211712;border:none;font-weight:700}
.donebtns .secondary{background:var(--card2);color:var(--ink);border:1.5px solid var(--border)}
.svg-inline{display:inline-block;vertical-align:-3px;width:16px;height:16px;margin:0 2px}
.elpill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:0.72rem;font-weight:700;border:1px solid var(--border)}
</style></head><body>

<div id="selectBackdrop"></div>
<div id="topbar">
  <div id="groupSelWrap">
    <button id="groupSelBtn" type="button"><span class="lbl" id="groupSelLabel">Loading…</span><span class="chev">▾</span></button>
    <div id="groupSelList"></div>
  </div>
  <span class="score"><span id="sc">0</span>/<span id="an">0</span></span>
</div>
<div id="modes">
 <button data-m="all" class="on">Everything</button>
 <button data-m="id">Identify</button>
 <button data-m="fn">Element &amp; Meridian Facts</button>
</div>
<div id="progwrap">
  <div class="pbar"><div id="pfill" style="width:0%"></div></div>
  <div class="progtext" id="progtext"></div>
</div>

<div id="main">
  <div class="card" id="qcard">
    <div class="dhead"><div id="deckIcon" class="icon"></div><div class="t" id="deckTitle"></div><div class="s" id="deckSub"></div></div>
    <div class="imgwrap" id="imgwrap" style="display:none"><img id="qimg" loading="lazy"></div>
    <div class="qcat" id="qcatEl"></div>
    <div class="qt" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="whynote" id="whynote"></div>
  </div>
  <div class="card" id="doneCard">
    <div class="big" id="doneScore"></div>
    <div class="lbl">questions answered correctly</div>
    <div class="donebtns">
      <button class="primary" id="retryBtn">Try this deck again</button>
    </div>
  </div>
</div>

<div id="bottombar"><div class="inner"><button id="nextBtn">Next question →</button></div></div>

ity", "Death"], "why": "Degeneration — the stage of breaking down, between Earth's Maturity and Water's Death."}, {"type": "single", "cat": "Colour", "icon": "metal", "q": "What colour is associated with Metal?", "correct": "White", "wrong": ["Green", "Red", "Yellow", "Black"], "why": "White — often shown as silver/pale in practice, since pure white is hard to print."}, {"type": "single", "cat": "Flavour", "icon": "metal", "q": "What flavour is associated with Metal?", "correct": "Spicy", "wrong": ["Sour", "Bitter", "Sweet", "Salty"], "why": "Spicy/pungent — think ginger, garlic, chili; foods said to move stagnant Lung Qi."}, {"type": "single", "cat": "Power", "icon": "metal", "q": "What \"power\" (quality of movement) is associated with Metal, per your correspondence chart?", "correct": "Contraction", "wrong": ["Expansion", "Completion", "Transition", "Consolidation"], "why": "Flagged conflict: your chart image shows Metal = Contraction and Water = Consolidation, but Earth_Metal_Elements.md says Metal's Power is \"Consolidation.\" Going with the chart image here since it's the fresher source — not silently reconciled."}, {"type": "single", "cat": "Lung Function", "icon": "metal", "q": "Which of these is a function of the <b>Lung</b>?", "correct": "Controls Qi and breath", "wrong": ["Controls the passage and excretion of faeces", "Controls 'the rotting and ripening' of food", "Regulates blood production and containment"], "why": "The Lung controls Qi/breath, distributes Qi and fluids through the body, and governs the skin/Cou Li space."}, {"type": "single", "cat": "Lung Function", "icon": "metal", "q": "Besides breath, what else does the Lung distribute?", "correct": "Qi and fluids to the whole body", "wrong": ["Blood to the vessels only", "Food essences only", "Bile to the digestive tract"], "why": "The Lung 'showers' Qi and fluids downward and outward to the whole body — a key TCM function."}, {"type": "single", "cat": "Large Intestine Function", "icon": "metal", stem", "Auto-immune disorders", "Chronic pain", "Inflammatory bowel diseases", "Inability to process grief"], "why": "Indigestion, nausea/vomiting and prolapse are Earth's physical out-of-balance signs, not Metal's — a reminder that these lists can share a neighborhood without being the same element."}, {"type": "multi", "cat": "Out of Balance", "icon": "metal", "q": "Select every <b>emotional/mental</b> sign of <b>Metal</b> out of balance (some Earth signs are mixed in as decoys):", "options": ["Stuck in denial / avoidance", "Overthinking", "Pleasure-seeking behaviours", "Inability to say no", "Inability to let go of what's no longer valuable", "Holding on to the past", "Low self-worth", "Disconnected from your centre", "Numbness (inability to feel)"], "correct": ["Stuck in denial / avoidance", "Pleasure-seeking behaviours", "Inability to let go of what's no longer valuable", "Holding on to the past", "Low self-worth", "Numbness (inability to feel)"], "why": "Overthinking, inability to say no, and feeling disconnected from your centre are Earth's signs — Metal's theme is holding on / letting go, not over-giving."}]}], "ELEMENTS": {"Wood": {"color": "#7fb069", "label": "Wood"}, "Fire": {"color": "#e0685a", "label": "Fire"}, "Earth": {"color": "#e0b23c", "label": "Earth"}, "Metal": {"color": "#e7e4da", "label": "Metal"}, "Water": {"color": "#8a97ab", "label": "Water"}}};
const DECKS = DATA.DECKS;
const ELEMENTS = DATA.ELEMENTS;

// ── SVG ICONS ─────────────────────────────────────────────────────────────
const ICONS = {
  metal: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 L21 8 L18 21 L6 21 L3 8 Z"/></svg>`,
  water: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 15c2 1 3-1 5 0s3 1 5 0 3-1 5 0"/><path d="M3 19c2 1 3-1 5 0s3 1 5 0 3-1 5 0"/><path d="M12 2c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10Z"/></svg>`,
  fire: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2c1 3-2 4-2 7a3 3 0 0 0 6 0c0-1-.5-2-1-2 1 4-1 5-3 8a5 5 0 0 1-4-8c1-2 3-3 4-5Z"/></svg>`,
  wind: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 14h14a3 3 0 1 1-3 3"/><path d="M3 19h8a2.5 2.5 0 1 0-2.5-2.5"/></svg>`,
  earth: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 20 L9 8 L13 14 L16 9 L22 20 Z"/><path d="M2 20h20"/></svg>`,
  dryness: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="4"/><path d="M12 2v1.5M12 15v1.5M5 9h1.5M17.5 9H19M6.5 3.5l1 1M16.5 4.5l1-1M6.5 14.5l1-1M16.5 13.5l1 1"/><path d="M6 20l3-4M11 20l2-3M16 20l3-4"/></svg>`,
  heat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3v9a3 3 0 0 0 6 0V3"/><circle cx="9" cy="16" r="3"/></svg>`,
  dampness: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3c1.5 2 3 3.5 3 6a3 3 0 1 1-6 0c0-2.5 1.5-4 3-6Z"/><path d="M16 10c1.5 2 3 3.5 3 6a3 3 0 1 1-6 0c0-2.5 1.5-4 3-6Z"/></svg>`,
  cold: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2v20M5 6l14 12M19 6L5 18M4 12h16M7 9l-3-1M7 15l-3 1M17 9l3-1M17 15l3 1"/></svg>`,
};
function compassIcon(highlight){
  const dirs = [["N",12,4],["E",20,12],["S",12,20],["W",4,12],["C",12,12]];
  let dots = dirs.map(([l,x,y])=>{
    const on = (highlight||"").toUpperCase().startsWith(l) || (highlight==="Center"&&l==="C");
    return `<text x="${x}" y="${y+3}" font-size="6" text-anchor="middle" fill="${on?'var(--accent)':'#6b675e'}" font-weight="${on?800:400}">${l}</text>`;
  }).join("");
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#6b675e" stroke-width="1.3"><circle cx="12" cy="12" r="10"/>${dots}</svg>`;
}
function getIcon(key, correctAnswerForDirection){
  if(key && key.startsWith("compass")) return compassIcon(correctAnswerForDirection);
  return ICONS[key] || ICONS.metal;
}

const MIXED_CAP = 25;
let curDeck=DECKS[0], mode='all', queue=[], qi=0, score=0, answered=0;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const groupSelBtn=document.getElementById('groupSelBtn');
const groupSelList=document.getElementById('groupSelList');
const groupSelLabel=document.getElementById('groupSelLabel');
const selectBackdrop=document.getElementById('selectBackdrop');

function selectGroup(idx, label){
  groupSelLabel.textContent=label; closeGroupList();
  curDeck = DECKS[idx];
  applyElementTheme(curDeck.element);
  buildQueue();
}
DECKS.forEach((d,i)=>{
  const opt=document.createElement('div'); opt.className='opt';
  opt.textContent = d.element+' — '+d.title;
  opt.onclick=()=>selectGroup(i, d.element+' — '+d.title);
  groupSelList.appendChild(opt);
});
groupSelLabel.textContent = DECKS[0].element+' — '+DECKS[0].title;
function openGroupList(){ groupSelList.classList.add('open'); selectBackdrop.classList.add('open'); }
function closeGroupList(){ groupSelList.classList.remove('open'); selectBackdrop.classList.remove('open'); }
groupSelBtn.onclick=()=>{ groupSelList.classList.contains('open') ? closeGroupList() : openGroupList(); };
selectBackdrop.onclick=closeGroupList;

document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m; buildQueue();
});

function applyElementTheme(elName){
  const el = ELEMENTS[elName] || ELEMENTS.Metal;
  document.documentElement.style.setProperty('--accent', el.color);
  const icon = document.getElementById('deckIcon');
  icon.innerHTML = getIcon('metal').replace('currentColor', el.color);
  icon.style.color = el.color;
}

function buildIdQuestions(deck){
  return deck.images.map(im=>({
    kind:'identify', type:'single', cat:'Identify the meridian', icon:'metal',
    q:'Which meridian pathway is shown here?',
    correct: im.answer,
    wrong: shuffle(deck.idPool).slice(0,3),
    img: im.img
  }));
}

function buildQueue(){
  const idQs = buildIdQuestions(curDeck);
  const fnQs = curDeck.questions.map(q=>({...q, kind:'fn'}));
  let all = idQs.concat(fnQs);
  if(mode==='id') all = idQs;
  if(mode==='fn') all = fnQs;
  queue = shuffle(all);
  qi=0; answered=0; score=0;
  document.getElementById('sc').textContent='0';
  document.getElementById('an').textContent='0';
  document.getElementById('doneCard').style.display='none';
  document.getElementById('qcard').style.display='block';
  document.getElementById('deckTitle').textContent=curDeck.title;
  document.getElementById('deckSub').textContent=curDeck.sub;
  renderQ();
}

let curImgRef = null;
function renderQ(){
  document.getElementById('nextBtn').style.display='none';
  if(qi>=queue.length){ showDone(); return; }
  const item = queue[qi];
  const pct = Math.round((qi/queue.length)*100);
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('progtext').textContent='Question '+(qi+1)+' of '+queue.length;

  const iw = document.getElementById('imgwrap');
  if(item.img){
    iw.style.display='flex';
    if(item.img !== curImgRef){ document.getElementById('qimg').src='data:image/png;base64,'+item.img; curImgRef=item.img; }
  } else { iw.style.display='none'; curImgRef=null; }

  const dirHighlight = typeof item.correct === 'string' ? item.correct : 'West';
  const catIcon = item.icon==='compass-west' ? getIcon('compass-west', dirHighlight) : getIcon(item.icon);
  document.getElementById('qcatEl').innerHTML = catIcon + item.cat;
  document.getElementById('qtext').innerHTML = item.q;

  const why = document.getElementById('whynote');
  why.classList.remove('show'); why.textContent='';

  const optsEl = document.getElementById('opts');
  optsEl.innerHTML='';

  if(item.type==='multi'){
    renderMulti(item, optsEl, why);
  } else {
    renderSingle(item, optsEl, why);
  }
  document.getElementById('main').scrollTop=0; window.scrollTo(0,0);
}

function renderSingle(item, optsEl, why){
  const opts = shuffle([item.correct, ...item.wrong.slice(0,3)]);
  opts.forEach(optText=>{
    const btn=document.createElement('button');
    btn.className='o'; btn.textContent=optText;
    btn.onclick=()=>{
      if(item._done) return; item._done=true; answered++;
      const correct = optText===item.correct;
      if(correct) score++;
      document.getElementById('sc').textContent=score; document.getElementById('an').textContent=answered;
      document.querySelectorAll('#opts button.o').forEach(b=>{
        b.disabled=true;
        if(b.textContent===item.correct) b.classList.add('correct');
        else if(b===btn && !correct) b.classList.add('wrong');
      });
      if(!correct && item.why){ why.textContent = item.why; why.classList.add('show'); }
      document.getElementById('nextBtn').style.display='block';
    };
    optsEl.appendChild(btn);
  });
}

function renderMulti(item, optsEl, why){
  const opts = shuffle(item.options);
  const wrap = document.createElement('div'); wrap.style.display='grid'; wrap.style.gap='8px';
  const boxes = [];
  opts.forEach(optText=>{
    const row = document.createElement('label'); row.className='checkopt';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.value=optText;
    const span = document.createElement('span'); span.textContent=optText;
    row.appendChild(cb); row.appendChild(span);
    wrap.appendChild(row);
    boxes.push({row,cb,text:optText});
  });
  optsEl.appendChild(wrap);
  const submit = document.createElement('button');
  submit.className='submitBtn'; submit.textContent='Check answers';
  submit.onclick=()=>{
    if(item._done) return; item._done=true; answered++;
    const selected = boxes.filter(b=>b.cb.checked).map(b=>b.text);
    const correctSet = item.correct;
    const exact = selected.length===correctSet.length && selected.every(s=>correctSet.includes(s));
    if(exact) score++;
    document.getElementById('sc').textContent=score; document.getElementById('an').textContent=answered;
    boxes.forEach(b=>{
      b.cb.disabled=true;
      const isCorrectAns = correctSet.includes(b.text);
      const isSelected = selected.includes(b.text);
      if(isCorrectAns && isSelected) b.row.classList.add('correct');
      else if(!isCorrectAns && isSelected) b.row.classList.add('wrong');
      else if(isCorrectAns && !isSelected) b.row.classList.add('missed');
    });
    if(!exact && item.why){ why.textContent = item.why; why.classList.add('show'); }
    document.getElementById('nextBtn').style.display='block';
  };
  optsEl.appendChild(submit);
}

document.getElementById('nextBtn').onclick=()=>{ qi++; renderQ(); };

function showDone(){
  document.getElementById('qcard').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('doneCard').style.display='block';
  document.getElementById('doneScore').textContent=score+' / '+queue.length;
  window.scrollTo(0,0);
}
document.getElementById('retryBtn').onclick=()=>{ queue.forEach(q=>delete q._done); buildQueue(); };

applyElementTheme(DECKS[0].element);
buildQueue();
</script>
